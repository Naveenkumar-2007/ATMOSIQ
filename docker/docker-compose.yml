services:
  postgres:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_USER: atmosiq
      POSTGRES_PASSWORD: atmosiq
      POSTGRES_DB: atmosiq
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atmosiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    ports: ["6380:6379"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.2
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: [mlflow_data:/mlflow]

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://atmosiq:atmosiq@postgres:5432/atmosiq
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports: ["8001:8000"]
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+psycopg://atmosiq:atmosiq@postgres:5432/atmosiq
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MONITOR_INTERVAL_SECONDS: "300"
      RETRAIN_INTERVAL_SECONDS: "86400"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
    ports: ["3005:3000"]
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.51.2
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports: ["16686:16686", "4317:4317"]

volumes:
  postgres_data:
  mlflow_data:

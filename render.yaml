services:
  - type: web
    name: atmosiq
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health/live
    envVars:
      - key: PORT
        value: 7860
      - key: NODE_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: atmosiq-db
          property: connectionString

databases:
  - name: atmosiq-db
    plan: free
    databaseName: atmosiq
    user: atmosiq
